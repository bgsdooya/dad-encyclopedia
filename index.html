<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아빠표 백과사전</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아빠표 백과사전">
<meta name="theme-color" content="#dff1ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101a30" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dff1ff;--card:#ffffff;--ink:#1b2a4a;--muted:#55648a;--line:#1b2a4a;
  --sun:#ffc233;--warn-bg:#ffe1dc;--warn-ink:#8a1c10;--night:#14213f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a30;--card:#1b2744;--ink:#f3f6ff;--muted:#b3c0e0;--line:#8ea4de;
    --warn-bg:#4a1f1a;--warn-ink:#ffc9c0;--night:#0a1226;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101a30;--card:#1b2744;--ink:#f3f6ff;--muted:#b3c0e0;--line:#8ea4de;
  --warn-bg:#4a1f1a;--warn-ink:#ffc9c0;--night:#0a1226;color-scheme:dark;
}
:root{--fh:"Nanum Gothic";--fb:"Nanum Gothic";--fw:800;--bw:400}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--fb),"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-weight:var(--bw);
  font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid #ff7a00;outline-offset:2px}
.jua,h1,h2,h3,.tile b,.item b,.lname,.qbtn b{font-family:var(--fh),"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:var(--fw)}

header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:31;
  background:var(--bg);padding:10px 16px 12px;border-bottom:3px solid var(--line);
}
.top-in{max-width:1080px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{border:0;background:none;padding:0;display:flex;align-items:center;gap:14px;text-align:left}
.brand span.lg{font-size:40px;line-height:1}
.brand .ttl{display:block;font-family:var(--fh),"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:var(--fw);font-size:28px;line-height:1.1}
.brand small{display:block;font-size:13px;color:var(--muted)}
.search{flex:1 1 260px;min-width:200px;position:relative;display:block}
.search::before{content:"🔍";position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
.search input{
  width:100%;height:52px;border:3px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);
  padding:0 20px 0 52px;font:inherit;font-size:19px;
}
.search input::placeholder{color:var(--muted)}

main{max-width:1080px;margin:0 auto;padding:16px 16px 40px}

.moon{
  display:flex;gap:16px;align-items:center;background:var(--night);color:#fff3c4;
  border:3px solid var(--line);border-radius:28px;padding:14px 18px;width:100%;text-align:left;
  box-shadow:0 6px 0 var(--line);margin-bottom:18px;
}
.moon .me{font-size:64px;line-height:1;flex:none}
.moon b{font-family:var(--fh),sans-serif;font-weight:var(--fw);font-size:24px;display:block;line-height:1.25}
.moon span.s{display:block;font-size:16px;opacity:.92}

.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.qbtn{
  border:3px solid var(--line);border-radius:20px;background:var(--sun);color:#1b2a4a;padding:10px 12px;
  box-shadow:0 4px 0 var(--line);min-height:56px;text-align:center;
}
.qbtn b{font-size:20px;display:block}
.qbtn>span{display:block;font-size:26px;line-height:1.2;margin-bottom:4px}
.qbtn:active,.tile:active,.item:active,.lrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

h2.sec{font-size:24px;margin:6px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{
  border:3px solid var(--line);border-radius:24px;background:var(--c);color:#1b2a4a;padding:14px 10px 12px;
  text-align:center;box-shadow:0 5px 0 var(--line);
}
.tile .em{font-size:54px;display:block;line-height:1.15;margin-bottom:8px}
.tile b{font-size:21px;display:block;margin-top:0;line-height:1.25}
.tile small{display:block;font-size:13px;line-height:1.35;margin-top:4px;opacity:.88}
.tile i{font-style:normal;display:inline-block;margin-top:6px;font-size:13px;background:rgba(255,255,255,.7);border-radius:999px;padding:0 10px}

.back{
  border:3px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;min-height:44px;margin-bottom:12px;
}
.chead{display:flex;gap:20px;align-items:center;margin-bottom:8px}
.chead .em{font-size:56px;line-height:1}
.chead h2{font-size:32px;margin:0;line-height:1.15}
.chead p{margin:0;color:var(--muted);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{
  border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;min-height:44px;font-size:16px;
}
.chip[aria-pressed="true"]{background:var(--sun);color:#1b2a4a}
.warn{
  background:var(--warn-bg);color:var(--warn-ink);border:3px solid var(--warn-ink);border-radius:18px;
  padding:10px 14px;margin:8px 0 12px;font-size:17px;
}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.item{
  position:relative;display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  border:3px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:10px 12px;
  box-shadow:0 4px 0 var(--line);
}
.item .em{font-size:42px;width:62px;height:62px;flex:none;display:grid;place-items:center;border-radius:16px;background:var(--c);border:2px solid var(--line)}
.item .tx{min-width:0;flex:1}
.item b{font-size:21px;display:block;line-height:1.25}
.item small{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  color:var(--muted);font-size:14.5px;line-height:1.4;
}
.item .bd{position:absolute;top:4px;right:10px;font-size:14px}
.ej{display:inline-block;margin-right:.3em}
.item .em .ej,.tile .em .ej,.chead .em .ej,.sh-top .big .ej,.lem .ej,.moon .me .ej,.qbtn>span .ej,.brand .lg .ej,.lrow .lem .ej{margin:0}
.item .bd .ej{margin:0 0 0 .15em}
.gh{font-family:var(--fh),sans-serif;font-weight:var(--fw);font-size:26px;margin:20px 0 8px}
.nav{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;background:var(--card);border-top:3px solid var(--line);padding:10px 12px}
.navb{flex:1;min-width:0;border:3px solid var(--line);background:var(--sun);color:#1b2a4a;border-radius:16px;min-height:52px;padding:4px 12px;font-size:17px}
.navb .nt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{flex:none;font-size:14px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted);border:3px dashed var(--line);border-radius:20px}

.note{border:3px solid var(--line);border-radius:18px;background:var(--card);padding:10px 14px;margin:0 0 14px;font-size:16px;color:var(--muted)}
.lrows{display:grid;gap:10px}
.lrow{
  display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:3px solid var(--line);border-radius:18px;
  background:var(--card);color:var(--ink);padding:8px 12px;box-shadow:0 4px 0 var(--line);
}
.lem{font-size:36px;width:48px;text-align:center;flex:none}
.lbody{flex:1;min-width:0;display:block}
.lname{font-size:19px;display:block;line-height:1.2}
.bar{display:block;height:16px;border:2px solid var(--line);border-radius:999px;background:var(--bg);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--sun)}
.lrow.me .bar i{background:#ff7a59}
.ltext{display:block;font-size:14.5px;color:var(--muted);line-height:1.35}

footer{max-width:1080px;margin:10px auto 0;padding:0 16px 30px;text-align:center;color:var(--muted);font-size:15px}

.ov{
  position:fixed;inset:0;z-index:50;background:rgba(8,14,32,.6);display:none;align-items:center;justify-content:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));
}
.ov.on{display:flex}
.sheet{
  background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:28px;width:100%;max-width:640px;
  max-height:100%;overflow:auto;box-shadow:0 8px 0 var(--line);overscroll-behavior:contain;
}
.sh-top{background:var(--c);color:#1b2a4a;text-align:center;padding:20px 16px 12px;border-bottom:3px solid var(--line);position:relative}
.sh-top .big{font-size:96px;line-height:1.1;margin-bottom:10px}
.sh-top h2{font-size:32px;margin:2px 0 0;line-height:1.2}
.close{
  position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;border:3px solid #1b2a4a;background:#fff;color:#1b2a4a;font-size:30px;line-height:1;padding:0;
}
.sh-body{padding:16px 18px 22px}
.desc{font-size:21px;line-height:1.5;margin:0 0 12px}
.life{margin:0 0 12px;font-size:18px}
ul.facts{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px}
ul.facts li{border:2px solid var(--line);border-radius:14px;padding:9px 14px;background:var(--bg);font-size:18px}
.tip{background:var(--sun);color:#1b2a4a;border:3px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 12px;font-size:17px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 18px;min-height:48px;font-size:17px;box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
@media (max-width:520px){
  .brand .ttl{font-size:24px}.brand span.lg{font-size:34px}
  .sh-top .big{font-size:80px}.desc{font-size:19px}
  .item{gap:18px}.lrow{gap:18px}.moon{gap:20px}.chead{gap:22px}.tile .em{margin-bottom:10px}.chip,.btn{gap:.4em}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" data-go="home" aria-label="처음으로">
      <span class="lg">🦉</span>
      <span><span class="ttl">아빠표 백과사전</span><small>궁금한 건 뭐든 찾아보자!</small></span>
    </button>
    <label class="search"><input id="q" type="search" placeholder="뭐가 궁금해? (예: 고래, 보름달)" autocomplete="off" enterkeyhint="search" aria-label="검색"></label>
  </div>
</header>
<main id="main"></main>
<footer><p id="ftxt" style="margin:0">아빠가 만든 백과사전 · 계속 자라는 중 🌱<br>빠진 게 있으면 아빠한테 알려줘!</p></footer>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
const CATS=[
 {id:"insect",emo:"🦋",name:"곤충",c:"#ffd9a8",d:"다리 6개! 나비, 벌, 개미…"},
 {id:"arthro",emo:"🕷️",name:"절지동물",c:"#e3d4f5",d:"거미, 게, 새우… 다리에 마디가 있어"},
 {id:"mammal",emo:"🐘",name:"포유류",c:"#ffc9c0",d:"새끼를 낳아 젖을 먹여요"},
 {id:"bird",emo:"🦉",name:"새",c:"#bfe6ff",d:"깃털이 있고 알을 낳아요"},
 {id:"reptile",emo:"🐢",name:"파충류·양서류",c:"#c8efc0",d:"거북이, 뱀, 개구리…"},
 {id:"sea",emo:"🐋",name:"바다·물속",c:"#b7e8ef",d:"고래부터 문어까지"},
 {id:"dino",emo:"🦖",name:"공룡",c:"#f2e1a0",d:"아주 아주 옛날 친구들"},
 {id:"plant",emo:"🌻",name:"식물",c:"#d4efb0",d:"꽃, 나무, 풀"},
 {id:"mushroom",emo:"🍄",name:"버섯",c:"#ffd0e0",d:"먹는 버섯 vs 독버섯",subs:["알아두기","먹는 버섯","독버섯"],
  warn:"⚠️ 산이나 들에서 딴 버섯은 어른도 먹지 않아요. 독버섯은 모양·색으로 구별할 수 없어요. 여기에 없는 버섯도 함부로 만지거나 먹으면 안 돼요!"},
 {id:"poison",emo:"☠️",name:"독 있는 친구들",c:"#ffb3b3",d:"동물·식물·버섯 — 조심!",subs:["알아두기","동물","식물","버섯"],
  warn:"⚠️ 여기에 없다고 안전한 게 아니에요! 모르는 동물·풀·열매·버섯은 함부로 만지거나 먹지 말고, 어른한테 먼저 물어봐요."},
 {id:"space",emo:"🌕",name:"달·우주",c:"#cfd6ff",d:"달, 해, 별, 행성"},
 {id:"nature",emo:"🌈",name:"자연 현상",c:"#bfeede",d:"무지개, 번개, 눈, 화산"},
 {id:"body",emo:"🫀",name:"우리 몸",c:"#ffd6e8",d:"심장, 뼈, 뇌, 똥까지"},
 {id:"why",emo:"❓",name:"왜 그럴까?",c:"#ffe58f",d:"궁금한 건 못 참아!"}
];
const D=[];
const SEAHORSE="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='1em' height='1em' style='display:block;margin:auto'><g stroke-linecap='round' stroke-linejoin='round'><g fill='#1b2a4a' stroke='#1b2a4a'><path d='M30 22 C36 28 32 38 35 44' fill='none' stroke-width='15'/><path d='M35 44 C38 55 50 55 49 46 C48 40 41 41 42 47' fill='none' stroke-width='10.5'/><ellipse cx='30' cy='34' rx='11' ry='12' stroke-width='1'/><circle cx='28' cy='17' r='11' stroke-width='1'/><path d='M22 20 L12 22.5' fill='none' stroke-width='8'/><ellipse cx='46' cy='32' rx='5.5' ry='8' transform='rotate(15 46 32)' stroke-width='1'/><circle cx='30' cy='6.5' r='3.5'/><circle cx='37' cy='10' r='3.5'/></g><g fill='#ffb03b' stroke='#ffb03b'><path d='M30 22 C36 28 32 38 35 44' fill='none' stroke-width='9.5'/><path d='M35 44 C38 55 50 55 49 46 C48 40 41 41 42 47' fill='none' stroke-width='5.2'/><ellipse cx='30' cy='34' rx='9' ry='10' stroke-width='1'/><circle cx='28' cy='17' r='8.8' stroke-width='1'/><path d='M22 20 L12 22.5' fill='none' stroke-width='4'/><ellipse cx='46' cy='32' rx='3.6' ry='6.2' transform='rotate(15 46 32)' fill='#ffd166' stroke='#ffd166' stroke-width='1'/><circle cx='30' cy='6.5' r='1.8'/><circle cx='37' cy='10' r='1.8'/></g><g fill='none' stroke='#ffe3a3' stroke-width='1.8'><path d='M23 31 Q30 34 37 30'/><path d='M22 37 Q30 40 37 36'/><path d='M25 43 Q30 45 36 42'/></g></g><circle cx='26' cy='15.5' r='2.4' fill='#1b2a4a'/><circle cx='25.2' cy='14.7' r='.8' fill='#fff'/></svg>";
function E(c,emo,name,desc,facts,o){D.push(Object.assign({cat:c.split(","),emo:emo,name:name,desc:desc,facts:facts},o||{}));}

/* ===== 곤충 ===== */
E("insect","🔍","곤충이 뭐야?","몸이 머리·가슴·배로 나뉘고 다리가 6개인 작은 동물이야.",["다리 6개, 더듬이 2개","대부분 날개가 있어","지구에서 종류가 가장 많은 동물이야"],{tip:"거미는 다리가 8개라서 곤충이 아니야. 세어 봐!"});
E("insect","🦋","나비","꽃의 꿀을 먹는 날개 달린 곤충이야. 알 → 애벌레 → 번데기 → 나비로 변해!",["날개는 반짝이는 작은 비늘가루로 덮여 있어","발로 맛을 느껴 (먹이가 맞는지 발로 확인!)","어른 나비는 보통 2~3주 살아 (종마다 달라)"],{life:.06,lt:"어른 나비 약 2~3주",kr:1,tip:"제왕나비는 수천 km를 날아서 따뜻한 곳으로 겨울나기 여행을 해."});
E("insect","🐝","꿀벌","꽃가루와 꿀을 모아 벌집에서 함께 사는 곤충이야.",["8자 춤으로 꽃밭이 어디 있는지 친구들에게 알려줘","일벌 한 마리가 평생 모으는 꿀은 티스푼 하나의 12분의 1쯤이야","여왕벌은 몇 년을 살고, 여름 일벌은 약 6주 살아"],{life:.12,lt:"여름 일벌 약 6주",ln:"꿀벌(일벌)",kr:1,tip:"과일과 채소의 꽃가루받이를 꿀벌이 많이 도와줘."});
E("insect","🐜","개미","줄을 서서 다니고 힘이 엄청 센 곤충이야.",["자기 몸무게의 수십 배를 들 수 있어","냄새로 길을 표시해서 줄지어 다녀","여왕개미는 10년 넘게 사는 종도 있어"],{life:10,lt:"여왕개미는 10년 넘게",ln:"여왕개미",kr:1,tip:"개미는 소리 대신 냄새로 ‘말’을 해."});

function moonInfo(){
  var syn=29.530588853,ref=Date.UTC(2000,0,6,18,14),now=Date.now();
  var age=(((now-ref)/864e5)%syn+syn)%syn;
  var P=[[1.84,"🌑","새달 (잘 안 보여)"],[5.53,"🌒","초승달"],[9.22,"🌓","상현달 (반달)"],[12.91,"🌔","차오르는 달"],[16.61,"🌕","보름달"],[20.3,"🌖","기우는 달"],[23.99,"🌗","하현달 (반달)"],[27.68,"🌘","그믐달"],[99,"🌑","새달 (잘 안 보여)"]];
  var p=P.filter(function(x){return age<x[0];})[0];
  var nf=(14.765-age+syn)%syn,d=new Date(now+nf*864e5);
  return {emo:p[1],name:p[2],near:Math.abs(age-14.765)<=1.2,n:Math.round(nf),md:(d.getMonth()+1)+"월 "+d.getDate()+"일"};
}

   +'<button class="qbtn" data-go="fav"><span>⭐</span><b>내 보물함</b></button></div>';
  h+='<h2 class="sec">뭐가 궁금해?</h2><div class="tiles">'+CATS.map(function(c){
    return '<button class="tile" data-go="cat" data-cat="'+c.id+'" style="--c:'+c.c+'"><span class="em">'+c.emo+'</span><b>'+c.name+'</b><small>'+c.d+'</small><i>'+idsOf(c.id).length+'개</i></button>';
  }).join("")+'</div>';
  return h;
}
function catHTML(){
  var c=catById[S.cat],ids=idsOf(c.id);
  var h=backBtn()+'<div class="chead"><span class="em">'+c.emo+'</span><div><h2>'+c.name+'</h2><p>'+c.d+'</p></div></div>';
  if(c.warn)h+='<p class="warn">'+c.warn+'</p>';
  if(c.subs){
    ids.sort(function(a,b){return c.subs.indexOf(subOf(a,c.id))-c.subs.indexOf(subOf(b,c.id));});
    h+='<div class="chips"><button class="chip" data-sub="" aria-pressed="'+(S.sub===""?"true":"false")+'">전체 '+ids.length+'</button>'
      +c.subs.map(function(s){
        var n=ids.filter(function(i){return subOf(i,c.id)===s;}).length;
        return '<button class="chip" data-sub="'+s+'" aria-pressed="'+(S.sub===s?"true":"false")+'">'+s+' '+n+'</button>';
      }).join("")+'</div>';
    if(S.sub)ids=ids.filter(function(i){return subOf(i,c.id)===S.sub;});
  }
  return h+listHTML(ids,c.id);
}
function lifeHTML(){
  var ids=[];D.forEach(function(e,i){if(e.life!=null)ids.push(i);});
  ids.sort(function(a,b){return D[a].life-D[b].life;});
  CUR_LIST=ids.slice();
  var mx=Math.sqrt(D[ids[ids.length-1]].life);
  var h=backBtn()+'<div class="chead"><span class="em">🏆</span><div><h2>수명 대결</h2><p>짧게 사는 친구 → 오래 사는 친구 순서야</p></div></div>';
  h+='<p class="note">막대는 ‘오래 사는 편’을 대략 나타낸 거야. 종류와 환경에 따라 달라져. 막대 길이는 보기 좋게 줄여서 그렸어. 사람은 주황색이야!</p><div class="lrows">';
  h+=ids.map(function(i){
    var e=D[i],w=Math.max(3,Math.sqrt(e.life)/mx*100);
    return '<button class="lrow'+(e.name==="사람"?" me":"")+'" data-open="'+i+'"><span class="lem">'+e.emo+'</span><span class="lbody"><span class="lname">'+esc(e.ln||e.name)+'</span><span class="bar"><i style="width:'+w+'%"></i></span><span class="ltext">'+esc(e.lt)+'</span></span></button>';
  }).join("")+'</div>';
  h+='<p class="note" style="margin-top:14px">🌳 나무는 더 오래 살아! 은행나무 중에는 1,000년이 넘은 나무도 있어.</p>';
  return h;
}
function abcHTML(){
  var ids=D.map(function(e,i){return i;}).sort(function(a,b){return D[a].name.localeCompare(D[b].name,"ko");});
  var present=[];
  ids.forEach(function(i){var c=choOf(D[i].name);if(present.indexOf(c)<0)present.push(c);});
  present.sort(function(a,b){return choKey(a)-choKey(b);});
  var h=backBtn()+'<div class="chead"><span class="em">🔤</span><div><h2>가나다 순</h2><p>첫 글자로 찾아봐</p></div></div>';
  h+='<div class="chips"><button class="chip" data-sub="" aria-pressed="'+(S.sub===""?"true":"false")+'">전체</button>'
    +present.map(function(c){return '<button class="chip" data-sub="'+c+'" aria-pressed="'+(S.sub===c?"true":"false")+'">'+c+'</button>';}).join("")+'</div>';
  if(S.sub)ids=ids.filter(function(i){return choOf(D[i].name)===S.sub;});
  CUR_LIST=ids.slice();
  var last="",open=false;
  ids.forEach(function(i){
    var c=choOf(D[i].name);
    if(c!==last){if(open)h+='</div>';h+='<h3 class="gh">'+c+'</h3><div class="list">';open=true;last=c;}
    h+=itemHTML(i);
  });
  if(open)h+='</div>';
  return h;
}
function seenHTML(){
  var ids=[];
  D.forEach(function(e,i){if(SEEN[e.name])ids.push(i);});
  ids.sort(function(a,b){return (SEEN[D[b].name]-SEEN[D[a].name])||D[a].name.localeCompare(D[b].name,"ko");});
  ids=ids.slice(0,40);
  CUR_LIST=ids.slice();
  var h=backBtn()+'<div class="chead"><span class="em">👀</span><div><h2>자주 본 친구</h2><p>이 기기에서 많이 열어 본 순서야</p></div></div>';
  if(!ids.length)return h+'<div class="empty">아직 기록이 없어요.<br>친구들을 구경하면 여기에 쌓여요!</div>';
  h+='<div class="list">'+ids.map(function(i){return itemHTML(i,null,"👀 "+SEEN[D[i].name]+"번");}).join("")+'</div>';
  h+='<p style="text-align:center;margin-top:18px"><button class="chip" data-clearseen>기록 지우기</button></p>';
  return h;
}
function krHTML(){
  var ids=[];D.forEach(function(e,i){if(e.kr)ids.push(i);});
  return backBtn()+'<div class="chead"><span class="em">🇰🇷</span><div><h2>우리나라 친구들</h2><p>우리나라에서 만날 수 있거나 우리나라와 관련 있어</p></div></div>'+listHTML(ids);
}
function favHTML(){
  var ids=[];FAV.forEach(function(n){var i=idxByName(n);if(i>-1)ids.push(i);});
  var h=backBtn()+'<div class="chead"><span class="em">⭐</span><div><h2>내 보물함</h2><p>좋아하는 친구를 ⭐로 모아 봐</p></div></div>';
  return h+(ids.length?listHTML(ids):'<div class="empty">아직 비어 있어요.<br>친구 이야기에서 “보물함에 넣기”를 눌러 봐!</div>');
}
function searchIds(q){
  q=q.trim().toLowerCase();
  var hit=CATS.filter(function(c){return c.name.toLowerCase().indexOf(q)>-1;}).map(function(c){return c.id;});
  var r=[];
  D.forEach(function(e,i){
    if(e.cat.some(function(c){return hit.indexOf(c)>-1;})){r.push(i);return;}
    var t=(e.name+" "+e.desc+" "+e.facts.join(" ")+" "+(e.tip||"")+" "+(e.lt||"")).toLowerCase();
    if(t.indexOf(q)>-1)r.push(i);
  });
  return r;
}
function render(){
  var h;
  if(S.q.trim()){var ids=searchIds(S.q);h='<h2 class="sec">🔍 ‘'+esc(S.q.trim())+'’ 찾은 것 '+ids.length+'개</h2>'+listHTML(ids);}
  else if(S.view==="cat")h=catHTML();
  else if(S.view==="life")h=lifeHTML();
  else if(S.view==="kr")h=krHTML();
  else if(S.view==="fav")h=favHTML();
  else if(S.view==="abc")h=abcHTML();
  else if(S.view==="seen")h=seenHTML();
  else h=homeHTML();
  $("#main").innerHTML=W(h);
}
function go(view,cat){
  cat=cat||"";
  var same=(S.view===view&&S.cat===cat&&S.sub===""&&S.q===""&&DET===null);
  hideDetail();
  if(same){render();window.scrollTo(0,0);return;}
  saveScroll();
  S.view=view;S.cat=cat;S.sub="";S.q="";$("#q").value="";
  render();window.scrollTo(0,0);hpush();
}
function applyState(st){
  st=st||{view:"home",cat:"",sub:"",q:"",d:null,y:0};
  S.view=st.view;S.cat=st.cat;S.sub=st.sub;S.q=st.q;
  $("#q").value=st.q;
  render();
  if(st.d!=null){showDetail(st.d);}else{hideDetail();}
  window.scrollTo(0,st.y||0);
}

function openDetail(i){bump(i);saveScroll();showDetail(i);hpush();}
function navList(i){return CUR_LIST.indexOf(i)>-1?CUR_LIST:idsOf(D[i].cat[0]);}
function neighbor(i,d){var L=navList(i),n=L.length;if(n<2)return -1;var p=L.indexOf(i);return L[(p+d+n)%n];}
function stepDetail(d){
  if(DET===null)return;
  var to=neighbor(DET,d);if(to<0)return;
  bump(to);showDetail(to);hrepl();
}
function showDetail(i,keep){
  DET=i;
  var e=D[i],c=catById[e.cat[0]],poison=e.cat.indexOf("poison")>-1;
  var h='<div class="sh-top" style="--c:'+c.c+'"><button class="close" data-close aria-label="닫기">×</button><div class="big">'+e.emo+'</div><h2>'+esc(e.name)+'</h2></div><div class="sh-body">';
  if(poison)h+='<p class="warn">⚠️ 보기만 하고, 만지거나 먹지 않기! 여기에 없는 것도 모르면 함부로 만지지 말고 어른한테 먼저 물어봐.</p>';
  h+='<p class="desc">'+esc(e.desc)+'</p>';
  if(e.lt)h+='<p class="life">⏳ 수명: <b>'+esc(e.lt)+'</b></p>';
  h+='<ul class="facts">'+e.facts.map(function(f){return '<li>'+esc(f)+'</li>';}).join("")+'</ul>';
  if(e.tip)h+='<p class="tip">💡 '+esc(e.tip)+'</p>';
  h+='<div class="chips">'+e.cat.map(function(id){return '<button class="chip" data-go="cat" data-cat="'+id+'">'+catById[id].emo+' '+catById[id].name+'</button>';}).join("")+'</div>';
  h+='<div class="acts"><button class="btn" data-speak="'+i+'">🔊 읽어 줘</button><button class="btn" data-fav="'+i+'">'+(isFav(i)?"⭐ 보물함에 있어":"☆ 보물함에 넣기")+'</button></div></div>';
  var pv=neighbor(i,-1),nx=neighbor(i,1);
  if(pv>-1){
    var L=navList(i);
    h+='<div class="nav"><button class="navb" data-nav="-1"><span class="nt">← '+esc(D[pv].name)+'</span></button><span class="pos">'+(L.indexOf(i)+1)+' / '+L.length+'</span><button class="navb" data-nav="1"><span class="nt">'+esc(D[nx].name)+' →</span></button></div>';
  }
  var top=keep?$("#sheet").scrollTop:0;
  $("#sheet").innerHTML=W(h);$("#sheet").scrollTop=top;
  $("#ov").classList.add("on");document.body.style.overflow="hidden";
}
function hideDetail(){
  DET=null;
  $("#ov").classList.remove("on");document.body.style.overflow="";
  try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(x){}
}
function closeDetail(){
  if(DET===null)return;
  if(history.state&&history.state.d!=null){history.back();}else{hideDetail();}
}
function speak(i){
  try{
    var s=window.speechSynthesis;if(!s)return;
    if(s.speaking){s.cancel();return;}
    var e=D[i];
    var t=[e.name,e.desc].concat(e.facts).concat(e.tip?[e.tip]:[]).join(". ");
    var u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=0.9;s.speak(u);
  }catch(x){}
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-open],[data-openname],[data-go],[data-sub],[data-close],[data-speak],[data-fav],[data-nav],[data-clearseen]");
  if(!t){if(ev.target.id==="ov")closeDetail();return;}
  if(t.hasAttribute("data-nav")){stepDetail(+t.getAttribute("data-nav"));return;}
  if(t.hasAttribute("data-clearseen")){if(window.confirm("자주 본 친구 기록을 지울까요?")){SEEN={};saveSeen();render();}return;}
  if(t.hasAttribute("data-close")){closeDetail();return;}
  if(t.hasAttribute("data-open")){openDetail(+t.getAttribute("data-open"));return;}
  if(t.hasAttribute("data-openname")){var k=idxByName(t.getAttribute("data-openname"));if(k>-1)openDetail(k);return;}
  if(t.hasAttribute("data-speak")){speak(+t.getAttribute("data-speak"));return;}
  if(t.hasAttribute("data-fav")){
    var i=+t.getAttribute("data-fav");toggleFav(i);
    showDetail(i,true);render();return;
  }
  if(t.hasAttribute("data-sub")){S.sub=t.getAttribute("data-sub");render();hrepl();return;}
  if(t.hasAttribute("data-go")){
    var g=t.getAttribute("data-go");
    if(g==="rand"){openDetail(Math.floor(Math.random()*D.length));return;}
    go(g,t.getAttribute("data-cat")||"");
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape")closeDetail();
  else if(ev.key==="ArrowLeft")stepDetail(-1);
  else if(ev.key==="ArrowRight")stepDetail(1);
});
(function(){
  var sh=$("#sheet"),x0=0,y0=0;
  sh.addEventListener("touchstart",function(e){var t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
  sh.addEventListener("touchend",function(e){
    var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>80&&Math.abs(dy)<50)stepDetail(dx<0?1:-1);
  },{passive:true});
})();
$("#q").addEventListener("input",function(ev){
  var had=S.q.trim()!=="";
  if(!had)saveScroll();
  S.q=ev.target.value;render();
  if(!had&&S.q.trim()!=="")hpush();else hrepl();
});
window.addEventListener("popstate",function(ev){applyState(ev.state);});
try{if("scrollRestoration" in history)history.scrollRestoration="manual";}catch(e){}
(function(){var ft=$("#ftxt");ft.innerHTML=W(ft.innerHTML);})();
render();
hrepl();
</script>
</body>
</html>
